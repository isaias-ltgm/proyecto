<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Ventas | Bodega Pepito</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="brand-icon">🏪</span>
            <span class="brand-name">Bodega Pepito</span>
        </div>
        <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Inicio</a></li>
            <li><a href="categorias.html" class="nav-link">Categorías</a></li>
            <li><a href="productos.html" class="nav-link">Productos</a></li>
            <li><a href="ventas.html" class="nav-link">Ventas</a></li>
            <li><a href="detalles.html" class="nav-link active">Detalle Ventas</a></li>
        </ul>
    </nav>

    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>📋 Detalle de Ventas</h1>
                <p class="subtitle">Desglose de productos por venta</p>
            </div>
            <button class="btn btn-primary" onclick="abrirModalNuevo()">+ Nuevo Detalle</button>
        </div>

        <div id="alert-box" class="alert"></div>

        <div class="search-bar">
            <input type="text" class="search-input" id="buscador" placeholder="Buscar por venta o producto..." oninput="filtrarTabla()">
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Venta</th>
                        <th>Producto</th>
                        <th>Precio Unitario</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-body">
                    <tr><td colspan="5" class="loading">Cargando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- MODAL -->
    <div class="modal-overlay" id="modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-titulo">Nuevo Detalle</h3>
                <button class="modal-close" onclick="cerrarModal()">✕</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="campo-id">
                <div class="form-group">
                    <label>Venta</label>
                    <select id="campo-venta">
                        <option value="">Seleccionar venta...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Producto</label>
                    <select id="campo-producto">
                        <option value="">Seleccionar producto...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precio Unitario (S/.)</label>
                    <input type="number" id="campo-precio" placeholder="0.00" step="0.01" min="0">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="cerrarModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="guardar()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        let datos = [];
        let ventas = [];
        let productos = [];

        async function cargar() {
            try {
                [datos, ventas, productos] = await Promise.all([
                    API.get('/detalles-venta'),
                    API.get('/ventas'),
                    API.get('/productos')
                ]);
                renderTabla(datos);
                cargarSelects();
            } catch(e) {
                document.getElementById('tabla-body').innerHTML =
                    '<tr><td colspan="5" class="empty-state">Error al cargar los datos</td></tr>';
            }
        }

        function cargarSelects() {
            const selVenta = document.getElementById('campo-venta');
            const selProd  = document.getElementById('campo-producto');
            const vActual  = selVenta.value;
            const pActual  = selProd.value;

            selVenta.innerHTML = '<option value="">Seleccionar venta...</option>';
            ventas.forEach(v => {
                selVenta.innerHTML += `<option value="${v.idVenta}">Venta #${v.idVenta} — S/. ${v.totalVenta ?? 0}</option>`;
            });

            selProd.innerHTML = '<option value="">Seleccionar producto...</option>';
            productos.forEach(p => {
                selProd.innerHTML += `<option value="${p.idProducto}">${p.nombreProducto} — S/. ${Number(p.precioUnitario ?? 0).toFixed(2)}</option>`;
            });

            selVenta.value = vActual;
            selProd.value  = pActual;
        }

        function renderTabla(lista) {
            const tbody = document.getElementById('tabla-body');
            if (!lista.length) {
                tbody.innerHTML = '<tr><td colspan="5"><div class="empty-state">Sin detalles registrados<p>Agrega un detalle a una venta</p></div></td></tr>';
                return;
            }
            tbody.innerHTML = lista.map(d => `
                <tr>
                    <td><span class="badge badge-purple">${d.idDetalleVenta}</span></td>
                    <td>${d.venta ? `<span class="badge badge-blue">Venta #${d.venta.idVenta}</span>` : '<span style="color:var(--text-muted)">Sin venta</span>'}</td>
                    <td>${d.producto ? d.producto.nombreProducto : '<span style="color:var(--text-muted)">Sin producto</span>'}</td>
                    <td>S/. ${d.precioUnitario != null ? Number(d.precioUnitario).toFixed(2) : '-'}</td>
                    <td>
                        <div class="actions-cell">
                            <button class="btn btn-secondary btn-sm" onclick="abrirModalEditar(${d.idDetalleVenta})">✏️ Editar</button>
                            <button class="btn btn-danger btn-sm" onclick="eliminar(${d.idDetalleVenta})">🗑️ Eliminar</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function filtrarTabla() {
            const q = document.getElementById('buscador').value.toLowerCase();
            const filtrados = datos.filter(d =>
                String(d.venta?.idVenta ?? '').includes(q) ||
                (d.producto?.nombreProducto ?? '').toLowerCase().includes(q)
            );
            renderTabla(filtrados);
        }

        function abrirModalNuevo() {
            document.getElementById('modal-titulo').textContent = 'Nuevo Detalle';
            document.getElementById('campo-id').value = '';
            document.getElementById('campo-venta').value = '';
            document.getElementById('campo-producto').value = '';
            document.getElementById('campo-precio').value = '';
            document.getElementById('modal').classList.add('open');
        }

        function abrirModalEditar(id) {
            const d = datos.find(x => x.idDetalleVenta === id);
            if (!d) return;
            document.getElementById('modal-titulo').textContent = 'Editar Detalle';
            document.getElementById('campo-id').value = d.idDetalleVenta;
            document.getElementById('campo-venta').value = d.venta?.idVenta ?? '';
            document.getElementById('campo-producto').value = d.producto?.idProducto ?? '';
            document.getElementById('campo-precio').value = d.precioUnitario ?? '';
            document.getElementById('modal').classList.add('open');
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('open');
        }

        document.getElementById('campo-producto').addEventListener('change', function() {
            const pid = parseInt(this.value);
            const prod = productos.find(p => p.idProducto === pid);
            if (prod && prod.precioUnitario) {
                document.getElementById('campo-precio').value = Number(prod.precioUnitario).toFixed(2);
            }
        });

        async function guardar() {
            const id       = document.getElementById('campo-id').value;
            const ventaId  = document.getElementById('campo-venta').value;
            const prodId   = document.getElementById('campo-producto').value;
            const precio   = document.getElementById('campo-precio').value;

            if (!precio) { mostrarAlerta('danger', 'El precio es obligatorio'); return; }

            const body = {
                precioUnitario: parseFloat(precio),
                venta:    ventaId  ? { idVenta:    parseInt(ventaId)  } : null,
                producto: prodId   ? { idProducto: parseInt(prodId)   } : null
            };

            try {
                if (id) {
                    await API.put(`/detalles-venta/${id}`, body);
                    mostrarAlerta('success', 'Detalle actualizado correctamente');
                } else {
                    await API.post('/detalles-venta', body);
                    mostrarAlerta('success', 'Detalle creado correctamente');
                }
                cerrarModal();
                cargar();
            } catch(e) {
                mostrarAlerta('danger', 'Error al guardar el detalle');
            }
        }

        async function eliminar(id) {
            if (!confirm('¿Eliminar este detalle?')) return;
            try {
                await API.delete(`/detalles-venta/${id}`);
                mostrarAlerta('success', 'Detalle eliminado');
                cargar();
            } catch(e) {
                mostrarAlerta('danger', 'Error al eliminar');
            }
        }

        document.getElementById('modal').addEventListener('click', e => {
            if (e.target === e.currentTarget) cerrarModal();
        });

        cargar();
    </script>
</body>
</html>
