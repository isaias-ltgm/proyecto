<!DOCTYPE html>
<html lang="Es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimarket Pepito</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- TOPBAR (solo visible en móvil) -->
    <div class="topbar">
        <div class="title-business">
            <span>Minimarket Pepito</span>
        </div>
        <div class="btn-menu">
            <button class="hamburger" aria-label="Abrir menú">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </div>

    <!-- OVERLAY -->
    <div class="overlay"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-logo">MINIMARKET PEPITO</div>
        <ul>
            <li>
                <a href="index.html"  data-page="home">
                    <i class="fa-solid fa-house"></i><span>Inicio</span>
                </a>
            </li>
            <li>
                <a href="categorias.html" class="activo" data-page="categorias">
                    <i class="fa-solid fa-clipboard-list"></i><span>Categorías</span>
                </a>
            </li>
            <li>
                <a href="ventas.html" data-page="ventas">
                    <i class="fa-solid fa-kitchen-set"></i><span>Ventas</span>
                </a>
            </li>
            <li>
                <a href="productos.html" data-page="productos">
                    <i class="fa-solid fa-user-check"></i><span>Productos</span>
                </a>
            </li>
            <li>
                <a href="detalles.html" data-page="detalles">
                    <i class="fa-solid fa-pen-to-square"></i><span>Detalle Venta</span>
                </a>
            </li>
        </ul>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <nav class="breadcrumb">
            <span>Categorías</span>
            <i class="fa-solid fa-chevron-right"></i>
            <span id="breadcrumb-page">Ventas</span>
        </nav>
        <div class="main-content">
            <!-- BOTÓN NUEVA -->
<button class="btn btn-primary mb-3"
  data-bs-toggle="modal"
  data-bs-target="#modalCategoria"
  onclick="limpiarFormularioCategoria()">
  <i class="fa-solid fa-plus"></i> Nueva Categoría
</button>

<!-- LISTA -->
<div id="lista-categorias"></div>

<!-- MODAL -->
<div class="modal fade" id="modalCategoria" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 id="titulo-cat">
          <i class="fa-solid fa-clipboard-list"></i> Nueva Categoría
        </h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="hidden" id="idCategoria">

        <input class="form-control mb-2" id="nombreCat" placeholder="Nombre">
        <input class="form-control mb-2" id="descCat" placeholder="Descripción">
      </div>

      <div class="modal-footer">
        <button class="btn btn-success" onclick="guardarCategoria()">
          <i class="fa-solid fa-check"></i> Guardar
        </button>

        <button class="btn btn-secondary" data-bs-dismiss="modal">
          <i class="fa-solid fa-xmark"></i> Cancelar
        </button>
      </div>

    </div>
  </div>
</div>
        </div>
    </main>

    <script src="js/categorias.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
